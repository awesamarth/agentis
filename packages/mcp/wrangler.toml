name = "agentis-mcp"
main = "src/worker.ts"
compatibility_date = "2026-06-07"
compatibility_flags = ["nodejs_compat"]

[vars]
AGENTIS_API_URL = "https://api.agentis.systems"

# Backend configuration when using this hostname:
# AGENTIS_PUBLIC_API_URL=https://api.agentis.systems
# AGENTIS_MCP_RESOURCE=https://mcp.agentis.systems/mcp
# No introspection secret: this worker only forwards HTTP to the backend.
